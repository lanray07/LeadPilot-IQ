name: iOS Build and App Store Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the archived build to App Store Connect
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  PROJECT_PATH: LeadPilotIQ.xcodeproj
  SCHEME: LeadPilotIQ
  CONFIGURATION: Release
  BUNDLE_IDENTIFIER: com.leadpilotiq.app
  ARCHIVE_PATH: ${{ github.workspace }}/build/LeadPilotIQ.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/LeadPilotIQExport
  API_KEY_PATH: ${{ github.workspace }}/build/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
  SIGNING_OUTPUT_PATH: ${{ github.workspace }}/build/signing
  PROFILE_NAME: LeadPilot IQ AppStore
  PROFILE_FILENAME: LeadPilotIQ_AppStore.mobileprovision

jobs:
  build:
    name: Build LeadPilot IQ
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate project
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -list

      - name: Build unsigned simulator app
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.upload_to_app_store_connect }}
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate upload secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "APPLE_TEAM_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "APP_STORE_CONNECT_KEY_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "APP_STORE_CONNECT_ISSUER_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_API_KEY_P8" || (echo "APP_STORE_CONNECT_API_KEY_P8 secret is missing" && exit 1)
          CERTIFICATE_BASE64="${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:-${APPLE_CERTIFICATE_BASE64:-$APP_STORE_CONNECT_API_KEY_BASE64}}"
          test -n "$CERTIFICATE_BASE64" || (echo "iOS distribution certificate base64 secret is missing" && exit 1)

      - name: Write App Store Connect API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p build
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["APP_STORE_CONNECT_API_KEY_P8"].replace("\\n", "\n")
          path = Path(os.environ["API_KEY_PATH"])
          path.write_text(key)
          path.chmod(0o600)
          PY

      - name: Install fastlane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        run: gem install fastlane -NV

      - name: Create signing keychain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/leadpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Import distribution certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          CERTIFICATE_BASE64="${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:-${APPLE_CERTIFICATE_BASE64:-$APP_STORE_CONNECT_API_KEY_BASE64}}"
          CERTIFICATE_PASSWORD="${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          export CERTIFICATE_PATH CERTIFICATE_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_BASE64"])
          )
          PY
          if ! security import "$CERTIFICATE_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "$CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -T /usr/bin/xcodebuild; then
            if [ -n "$CERTIFICATE_PASSWORD" ]; then
              echo "Certificate import failed with the provided password; retrying as an empty-password .p12."
              security import "$CERTIFICATE_PATH" \
                -k "$KEYCHAIN_PATH" \
                -P "" \
                -T /usr/bin/codesign \
                -T /usr/bin/security \
                -T /usr/bin/xcodebuild
            else
              exit 1
            fi
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          CERTIFICATE_PEM="$RUNNER_TEMP/apple-distribution.pem"
          security find-certificate -c "Apple Distribution" -p "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM" || true
          if [ ! -s "$CERTIFICATE_PEM" ]; then
            security find-certificate -c "iPhone Distribution" -p "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          fi
          CERTIFICATE_SERIAL=$(openssl x509 -in "$CERTIFICATE_PEM" -serial -noout | cut -d= -f2 | tr '[:lower:]' '[:upper:]')
          test -n "$CERTIFICATE_SERIAL" || (echo "Could not read distribution certificate serial number" && exit 1)
          echo "CERTIFICATE_SERIAL=$CERTIFICATE_SERIAL" >> "$GITHUB_ENV"

      - name: Resolve Apple certificate id
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          function base64url(input) {
            return Buffer.from(input).toString("base64").replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
          }

          function derToJose(signature) {
            const bytes = Buffer.from(signature);
            let offset = 3;
            let rLength = bytes[offset++];
            let r = bytes.slice(offset, offset + rLength);
            offset += rLength + 1;
            let sLength = bytes[offset++];
            let s = bytes.slice(offset, offset + sLength);
            while (r.length > 0 && r[0] === 0) r = r.slice(1);
            while (s.length > 0 && s[0] === 0) s = s.slice(1);
            return base64url(Buffer.concat([Buffer.alloc(32 - r.length), r, Buffer.alloc(32 - s.length), s]));
          }

          async function main() {
            const now = Math.floor(Date.now() / 1000);
            const header = base64url(JSON.stringify({ alg: "ES256", kid: process.env.APP_STORE_CONNECT_KEY_ID, typ: "JWT" }));
            const payload = base64url(JSON.stringify({
              iss: process.env.APP_STORE_CONNECT_ISSUER_ID,
              exp: now + 1200,
              aud: "appstoreconnect-v1"
            }));
            const signingInput = `${header}.${payload}`;
            const key = fs.readFileSync(process.env.API_KEY_PATH, "utf8");
            const signature = derToJose(crypto.createSign("SHA256").update(signingInput).sign(key));
            const response = await fetch("https://api.appstoreconnect.apple.com/v1/certificates?limit=200", {
              headers: { Authorization: `Bearer ${signingInput}.${signature}` }
            });
            const payloadJson = await response.json();
            if (!response.ok) {
              throw new Error(`Apple certificate lookup failed: ${response.status} ${JSON.stringify(payloadJson)}`);
            }
            const serial = process.env.CERTIFICATE_SERIAL.toUpperCase();
            const certificate = (payloadJson.data || []).find((item) =>
              item.attributes?.serialNumber?.toUpperCase() === serial
            );
            if (!certificate) {
              throw new Error("Imported .p12 certificate was not found in this Apple Developer team.");
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `APPLE_CERTIFICATE_ID=${certificate.id}\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Prepare App Store signing assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p fastlane "$SIGNING_OUTPUT_PATH"
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :ci_signing do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
                key_filepath: ENV.fetch("API_KEY_PATH"),
                duration: 1200,
                in_house: false
              )

              sigh(
                api_key: api_key,
                app_identifier: ENV.fetch("BUNDLE_IDENTIFIER"),
                team_id: ENV.fetch("APPLE_TEAM_ID"),
                cert_id: ENV.fetch("APPLE_CERTIFICATE_ID"),
                provisioning_name: ENV.fetch("PROFILE_NAME"),
                filename: ENV.fetch("PROFILE_FILENAME"),
                output_path: ENV.fetch("SIGNING_OUTPUT_PATH"),
                force: true
              )
            end
          end
          RUBY

          fastlane ios ci_signing

          PROFILE_PATH="$SIGNING_OUTPUT_PATH/$PROFILE_FILENAME"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_SPECIFIER=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_SPECIFIER" >> "$GITHUB_ENV"

      - name: Archive iOS app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Create export options
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.leadpilotiq.app</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Upload archive to App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
