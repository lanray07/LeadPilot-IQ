name: iOS Build and App Store Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the archived build to App Store Connect
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  PROJECT_PATH: LeadPilotIQ.xcodeproj
  SCHEME: LeadPilotIQ
  CONFIGURATION: Release
  BUNDLE_IDENTIFIER: com.leadpilotiq.app
  ARCHIVE_PATH: ${{ github.workspace }}/build/LeadPilotIQ.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/LeadPilotIQExport
  API_KEY_PATH: ${{ github.workspace }}/build/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
  SIGNING_OUTPUT_PATH: ${{ github.workspace }}/build/signing
  PROFILE_NAME: LeadPilot IQ AppStore
  PROFILE_FILENAME: LeadPilotIQ_AppStore.mobileprovision

jobs:
  build:
    name: Build LeadPilot IQ
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate project
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -list

      - name: Build unsigned simulator app
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.upload_to_app_store_connect }}
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate upload secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "APPLE_TEAM_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "APP_STORE_CONNECT_KEY_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "APP_STORE_CONNECT_ISSUER_ID secret is missing" && exit 1)
          test -n "$APP_STORE_CONNECT_API_KEY_P8" || (echo "APP_STORE_CONNECT_API_KEY_P8 secret is missing" && exit 1)

      - name: Write App Store Connect API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p build
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["APP_STORE_CONNECT_API_KEY_P8"].replace("\\n", "\n")
          path = Path(os.environ["API_KEY_PATH"])
          path.write_text(key)
          path.chmod(0o600)
          PY

      - name: Install fastlane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        run: gem install fastlane -NV

      - name: Create signing keychain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/leadpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Prepare App Store signing assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p fastlane "$SIGNING_OUTPUT_PATH"
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :ci_signing do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
                key_filepath: ENV.fetch("API_KEY_PATH"),
                duration: 1200,
                in_house: false
              )

              cert(
                api_key: api_key,
                team_id: ENV.fetch("APPLE_TEAM_ID"),
                generate_apple_certs: true,
                keychain_path: ENV.fetch("KEYCHAIN_PATH"),
                keychain_password: ENV.fetch("KEYCHAIN_PASSWORD"),
                output_path: ENV.fetch("SIGNING_OUTPUT_PATH")
              )

              sigh(
                api_key: api_key,
                app_identifier: ENV.fetch("BUNDLE_IDENTIFIER"),
                team_id: ENV.fetch("APPLE_TEAM_ID"),
                provisioning_name: ENV.fetch("PROFILE_NAME"),
                filename: ENV.fetch("PROFILE_FILENAME"),
                output_path: ENV.fetch("SIGNING_OUTPUT_PATH"),
                force: true
              )
            end
          end
          RUBY

          fastlane ios ci_signing

          PROFILE_PATH="$SIGNING_OUTPUT_PATH/$PROFILE_FILENAME"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_SPECIFIER=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_SPECIFIER" >> "$GITHUB_ENV"

      - name: Archive iOS app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Create export options
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.leadpilotiq.app</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Upload archive to App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
